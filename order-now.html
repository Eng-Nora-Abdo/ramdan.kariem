<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
<div class="container mt-5" style="max-width:600px;">
  <h2 class="mb-4 text-center">Place Your Order</h2>

  <form id="orderForm">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter your full name" required />
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label">Phone</label>
      <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required />
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <input type="text" class="form-control" id="address" placeholder="Enter your delivery address" required />
    </div>

    <div class="mb-3">
      <label for="product" class="form-label">Product / Drink</label>
      <input type="text" class="form-control" id="product" placeholder="Enter the product name" required />
    </div>

    <div class="mb-3">
      <label for="quantity" class="form-label">Quantity</label>
      <input type="number" class="form-control" id="quantity" placeholder="Enter quantity" min="1" required />
    </div>

    <div class="mb-3">
      <label for="price" class="form-label">Price</label>
      <input type="number" class="form-control" id="price" placeholder="Enter total price" min="0" required />
    </div>

    <button type="submit" class="btn btn-primary w-100">submit</button>
  </form>

</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
  </body>
</html>
